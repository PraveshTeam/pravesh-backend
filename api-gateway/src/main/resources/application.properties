server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=${Jwt__Key}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/onboarding/**,/api/admin/users/**,/api/admin/flats/**,/api/admin/guards/**,/api/admin/gates/**,/api/admin/onboarding/**,/api/guard/**,/api/societies/**,/api/society-onboarding/**,/api/superadmin/**,/api/gate-requests/**,/api/relocation/**,/api/admin/relocation-requests/**,/api/internal/**

# pass-service
spring.cloud.gateway.server.webflux.routes[1].id=pass-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://pass-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/passes/**,/api/admin/passes/**

# validation-service
spring.cloud.gateway.server.webflux.routes[2].id=validation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://validation-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/validate/**,/api/entries/**,/api/admin/entries/**

# notification-service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**,/api/preferences/**,/api/festivals/**,/api/announcements/**

# analytics-service
spring.cloud.gateway.server.webflux.routes[4].id=analytics-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/analytics/**

# assistant-service
spring.cloud.gateway.server.webflux.routes[5].id=assistant-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://assistant-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/assistant/**


spring.cloud.gateway.server.webflux.routes[6].id=notification-ws
spring.cloud.gateway.server.webflux.routes[6].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/ws/**

spring.cloud.gateway.server.webflux.routes[7].id=sos-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://sos-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/sos/**

spring.cloud.gateway.server.webflux.routes[8].id=payment-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/payments/**