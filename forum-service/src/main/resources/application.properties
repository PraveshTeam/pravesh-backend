server.port=8088
spring.application.name=forum-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/pravesh_forum?createDatabaseIfNotExist=true
spring.datasource.username=Pravesh
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

pravesh.internal.api-key=${INTERNAL_API_KEY}
