server.port=8087
spring.application.name=payment-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/pravesh_payments?createDatabaseIfNotExist=true
spring.datasource.username=Pravesh
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

pravesh.internal.api-key=${INTERNAL_API_KEY}

# Razorpay test-mode credentials — set as environment variables, never hardcoded.
# Get these from Razorpay Dashboard > Settings > API Keys (Test Mode) and
# Settings > Webhooks (for the webhook secret).
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
