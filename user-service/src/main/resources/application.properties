server.port=8081
spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/pravesh_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=Pravesh
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=${Jwt__Key}
jwt.expiration-ms=86400000
jwt.reset-token-expiration-ms=300000

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


pravesh.upload.onboarding-dir=E:/CDAC/Final Project/pravesh-major/uploads/onboarding

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


pravesh.internal.api-key=${INTERNAL_API_KEY}