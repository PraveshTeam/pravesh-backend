server.port=8083
spring.application.name=validation-service

spring.datasource.url=jdbc:mysql://localhost:3306/pravesh_entries?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=Pravesh
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

pravesh.internal.api-key=${INTERNAL_API_KEY}